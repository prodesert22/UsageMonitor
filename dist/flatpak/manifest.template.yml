# Flatpak manifest template for usage-monitor-cli.
#
# @@VERSION@@ and @@SOURCE_SHA256@@ are rendered by the release workflow
# (see .github/workflows/release.yml) from the published
# flatpak-source tarball it uploads. Do not edit the rendered manifest by
# hand; edit this template.
#
# Local build (needs flatpak-builder):
#   dist/flatpak/make-source-tarball.sh --version 0.10.0 --out-dir /tmp
#   dist/flatpak/render-manifest.sh --version 0.10.0 \
#     --source-sha256 "$(sha256sum /tmp/flatpak-source-0.10.0.tar.zst | cut -d' ' -f1)" \
#     --out /tmp/manifest.yml
#   flatpak-builder --force-clean build-dir /tmp/manifest.yml
#   flatpak-builder --run build-dir /tmp/manifest.yml usage-monitor-cli --help
#
# Sandbox notes (also in docs/installation.md): the CLI runs fully sandboxed,
# including `widget waybar|kde|gnome` payload output. Installing desktop
# widgets from inside the sandbox needs host access, so prefer the host
# package (deb/rpm/tarball) for `widget install`. Host re-execution is not
# implemented by the CLI.
app-id: dev.usage_monitor.UsageMonitor
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
command: usage-monitor-cli
finish-args:
  - --share=network
  # Required alongside fallback-x11 (flatpak-builder-lint finish-args-x11-without-ipc).
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # NOTE: no --talk-name=org.freedesktop.Flatpak on purpose (enforced by
  # dist/tests/test_dist.py): widget installation stays a host-package job;
  # the sandbox only runs payload commands. flatpak-builder-lint flags the
  # xdg-data/xdg-config sharing below, which is deliberate so the CLI config
  # dir stays shared with host installs (needs a Flathub exception).
  - --filesystem=xdg-data/usage-monitor:create
  - --filesystem=xdg-config/usage-monitor:create
modules:
  - name: usage-monitor-cli
    buildsystem: simple
    build-commands:
      - mkdir -p .cargo && cp flatpak-cargo-config.toml .cargo/config.toml
      - cargo --offline build --release --frozen
      - install -Dm755 target/release/usage-monitor-cli /app/bin/usage-monitor-cli
      - /app/bin/usage-monitor-cli generate-dist /tmp/um-dist
      - install -Dm644 /tmp/um-dist/man/man1/usage-monitor-cli.1 /app/share/man/man1/usage-monitor-cli.1
      - install -Dm644 /tmp/um-dist/completions/usage-monitor-cli.bash /app/share/bash-completion/completions/usage-monitor-cli
      - install -Dm644 /tmp/um-dist/completions/_usage-monitor-cli /app/share/zsh/vendor-completions/_usage-monitor-cli
      - install -Dm644 /tmp/um-dist/completions/usage-monitor-cli.fish /app/share/fish/vendor_completions.d/usage-monitor-cli.fish
      - install -Dm644 dist/usage-monitor-cli.desktop /app/share/applications/dev.usage_monitor.UsageMonitor.desktop
      - sed -i "s/^Icon=.*/Icon=dev.usage_monitor.UsageMonitor/" /app/share/applications/dev.usage_monitor.UsageMonitor.desktop
      - install -Dm644 dist/dev.usage_monitor.UsageMonitor.metainfo.xml /app/share/metainfo/dev.usage_monitor.UsageMonitor.metainfo.xml
      - install -Dm644 usage-monitor-cli/assets/kde/package/contents/images/usage-monitor.png /app/share/icons/hicolor/256x256/apps/dev.usage_monitor.UsageMonitor.png
    sources:
      - type: archive
        url: https://github.com/prodesert22/UsageMonitor/releases/download/v@@VERSION@@/flatpak-source-@@VERSION@@.tar.zst
        sha256: "@@SOURCE_SHA256@@"
