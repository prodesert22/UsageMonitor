name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.7.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Resolves to the dispatch input when run manually, else the pushed tag.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag format
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -p usage-monitor-cli --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyyaml
          ruff check widgets usage-monitor-cli/assets/waybar

      - name: Widget tests
        run: python -m unittest discover -s widgets -p 'test_*.py'

      - name: Packaging regressions
        run: ./dist/check.sh --quick

      - name: Tag matches crate version
        run: |
          tag_version="${TAG#v}"
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag_version crate=$crate_version"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag $TAG does not match crate version $crate_version"
            exit 1
          fi

      - name: Release notes exist
        run: test -f "releases/${TAG}.md"

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep incomplete artifacts out of the public release; allow retries.
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = true
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "$TAG" --notes-file "releases/${TAG}.md"
          fi

  publish-crate:
    name: Publish to crates.io
    needs: [verify, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p usage-monitor-cli --locked

  dist:
    name: Distribution packages
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # dist/flatpak/make-source-tarball.sh runs `git archive v$VERSION`.
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian zstd python3-yaml libssl-dev pkg-config dpkg-dev libarchive-tools
          cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build release binary + generated files
        run: |
          cargo build --release --locked
          ./target/release/usage-monitor-cli generate-dist usage-monitor-cli/dist-gen

      - name: Build .deb
        run: cargo deb -p usage-monitor-cli --locked

      - name: Lint .deb
        run: lintian --fail-on error target/debian/*.deb

      - name: Build .rpm
        # cargo-generate-rpm resolves asset sources from the repo root first.
        run: cargo generate-rpm -p usage-monitor-cli

      - name: Build generic tarball
        run: ./dist/make-tarball.sh --out-dir dist/artifacts

      - name: Collect deb + rpm
        run: |
          cp target/debian/*.deb target/generate-rpm/*.rpm dist/artifacts/
          ls dist/artifacts/

      - name: Build AppImage (Ubuntu 22.04 for glibc baseline)
        # A host-built binary would require GLIBC_2.39+ and refuse to start
        # on Ubuntu 22.04 / Debian 12. Building the payload on 22.04 keeps
        # the baseline at GLIBC_2.34, so one AppImage runs everywhere new.
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work ubuntu:22.04 bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq curl ca-certificates build-essential pkg-config libssl-dev git file >/dev/null
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null
              export PATH="$HOME/.cargo/bin:$PATH"
              ./dist/appimage/make-appimage.sh --out-dir dist/artifacts
            '

      - name: Smoke-test artifacts
        run: |
          images=(dist/artifacts/UsageMonitor-*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "${images[0]}" --help
          tar -xzf dist/artifacts/usage-monitor-cli-*.tar.gz -C /tmp
          installers=(/tmp/usage-monitor-cli-*/install.sh)
          "${installers[0]}" --prefix /tmp/tbprefix
          /tmp/tbprefix/bin/usage-monitor-cli list

      - name: Build Arch .pkg.tar.zst (container)
        run: |
          mkdir -p pkgbuild
          cp dist/arch/PKGBUILD pkgbuild/
          cp dist/artifacts/usage-monitor-cli-*.tar.gz pkgbuild/
          TARBALL="$(basename pkgbuild/usage-monitor-cli-*.tar.gz)"
          # Point the -bin PKGBUILD at the just-built local tarball so the
          # package is assembled before the release asset URL exists.
          # Bare filename (no file:// scheme): makepkg uses the local copy
          # directly; a relative file:// URL is rejected by curl.
          SHA="$(sha256sum "pkgbuild/$TARBALL" | cut -d' ' -f1)"
          sed -i "s|^source=.*|source=(\"$TARBALL\")|; s|^sha256sums=.*|sha256sums=(\"$SHA\")|" pkgbuild/PKGBUILD
          docker run --rm \
            -v "$PWD/pkgbuild:/pkgbuild" -w /pkgbuild archlinux:latest bash -c "
              set -e
              pacman -Syu --noconfirm base-devel python openssl >/dev/null
              useradd -m builder
              chown -R builder:builder /pkgbuild
              su builder -c 'cd /pkgbuild && makepkg --noconfirm'
            "
          cp pkgbuild/*.pkg.tar.zst dist/artifacts/

      - name: Build Flatpak source bundle + manifest
        run: |
          ./dist/flatpak/make-source-tarball.sh --out-dir dist/artifacts
          VERSION="${TAG#v}"
          SHA="$(sha256sum "dist/artifacts/flatpak-source-$VERSION.tar.zst" | cut -d' ' -f1)"
          ./dist/flatpak/render-manifest.sh --version "$VERSION" \
            --source-sha256 "$SHA" --out dist/artifacts/dev.usage_monitor.UsageMonitor.yml

      - name: Checksums + upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist/artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-SHA256SUMS)
          mv /tmp/dist-SHA256SUMS dist/artifacts/SHA256SUMS
          gh release upload "$TAG" dist/artifacts/* --clobber

  flatpak:
    name: Flatpak build check
    needs: [verify, dist]
    runs-on: ubuntu-latest
    permissions:
      # Write is required even though this job only downloads: draft
      # releases are invisible to read-only tokens, so `gh release
      # download` fails with "release not found" without it.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/flat
          gh release download "$TAG" -p 'flatpak-source-*.tar.zst' -D /tmp/flat
          gh release download "$TAG" -p 'dev.usage_monitor.UsageMonitor.yml' -D /tmp/flat

      - name: Build + smoke-test Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-yaml
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.rust-stable//24.08
          VERSION="${TAG#v}"
          SOURCE="/tmp/flat/flatpak-source-$VERSION.tar.zst"
          SHA="$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["modules"][0]["sources"][0]["sha256"])' /tmp/flat/dev.usage_monitor.UsageMonitor.yml)"
          printf '%s  %s\n' "$SHA" "$SOURCE" | sha256sum --check
          ./dist/flatpak/render-manifest.sh --version "$VERSION" --source-sha256 "$SHA" \
            --source-path "$SOURCE" --out /tmp/flat/dev.usage_monitor.UsageMonitor.yml
          flatpak-builder --force-clean --disable-rofiles-fuse --user build-dir /tmp/flat/dev.usage_monitor.UsageMonitor.yml
          flatpak-builder --run build-dir /tmp/flat/dev.usage_monitor.UsageMonitor.yml \
            usage-monitor-cli --help

  publish-release:
    name: Publish verified release
    needs: [publish-crate, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
